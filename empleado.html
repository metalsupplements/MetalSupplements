<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mostrador - Staff</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Modo <span>Staff</span></h1>
        <nav><a href="index.html">← Ir a Tienda</a></nav>
    </header>

    <div class="container">
        <div class="card" style="max-width: 600px; margin: auto;">
            <h2>Verificación en Mostrador</h2>
            <p>Escanea código QR o busca cliente:</p>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="input-busqueda" placeholder="Ej. Cliente #001">
                <button id="btn-buscar" class="btn" style="margin-top: 0; width: 150px;">Buscar</button>
            </div>

            <!-- Perfil del cliente oculto -->
            <div id="perfil-cliente" class="hidden" style="margin-top: 30px; border-top: 1px solid #333; padding-top: 20px; text-align: center;">
                <img src="https://ui-avatars.com/api/?name=Ali+Sant&background=ff2a2a&color=fff&size=150" class="foto-perfil" alt="Foto Membresía">
                <h3>Ali Sant (Miembro VIP)</h3>
                
                <div style="background: #111; padding: 15px; border-radius: 8px; margin: 15px 0;">
                    <h4 style="margin: 0 0 10px 0; color: var(--primary);">Política de Consumo Diario</h4>
                    <p style="margin: 0;">Piezas retiradas hoy: <strong id="contador-diario" style="font-size: 1.5em;">0 / 3</strong></p>
                    <div class="progreso-barra"><div id="barra-diaria" class="progreso-lleno"></div></div>
                    <p style="font-size: 0.8em; color: var(--text-muted);">Servicios restantes del mes: 26/30</p>
                </div>

                <button id="btn-despachar" class="btn btn-success">✅ Autorizar 1 Pieza</button>
                <button id="btn-recordatorio" class="btn" style="background: #444;">🔔 Enviar Recordatorio Consulta</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
