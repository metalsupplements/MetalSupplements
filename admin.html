<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Panel <span>Gerencial</span></h1>
        <nav><a href="index.html">← Ir a Tienda</a></nav>
    </header>

    <div class="container grid" style="grid-template-columns: 1fr 2fr;">
        <!-- Formulario -->
        <div class="card">
            <h2>Subir al Menú</h2>
            <form id="form-admin">
                <label>Nombre:</label>
                <input type="text" id="nombre" required>
                
                <label>Categoría:</label>
                <select id="categoria">
                    <option value="Monsters">Monsters / Energéticos</option>
                    <option value="Proteínas">Proteínas</option>
                    <option value="Pre-Entrenos">Pre-Entrenos</option>
                </select>

                <div style="display: flex; gap: 10px;">
                    <div>
                        <label>Costo Proveedor:</label>
                        <input type="number" id="costo" placeholder="$" required>
                    </div>
                    <div>
                        <label>Precio Venta:</label>
                        <input type="number" id="precio" placeholder="$" required>
                    </div>
                </div>

                <div style="background: #111; padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 15px;">
                    Margen de Utilidad Estimado: <br>
                    <strong id="margen-vista" style="color: var(--success); font-size: 1.2em;">$0 MXN (0%)</strong>
                </div>

                <button type="submit" class="btn">Subir y Publicar</button>
            </form>
        </div>

        <!-- Tabla de Firebase -->
        <div class="card">
            <h2>Inventario en Nube (Firebase)</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Costo</th>
                            <th>Venta</th>
                            <th>Utilidad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-admin">
                        <!-- JS inyectará la lista aquí -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
